resources:
  # Optional; if left out, automatically pick the cheapest cloud.
  cloud: lambda
  # region: us-west-2
  # Or A100, H100, etc.
  accelerators: GH200:1
  autostop:
    idle_minutes: 5
    down: true
  ordered:
    - region: us-west-2
    - region: us-west-1
    - region: us-east-1
    - region: us-east-2
    - region: us-east-3

file_mounts:
  /data:
    source: r2://signal-diffusion/
    mode: MOUNT_CACHED
    # type: DATASET_RO
  ~/.netrc: ~/.netrc
  ~/.cloudflare: ~/.cloudflare
  ~/.aws: ~/.aws
  ~/.cache/huggingface/token: ~/.cache/huggingface/token

# Working directory (optional) containing the project codebase.
# Its contents are synced to ~/sky_workdir/ on the cluster.
workdir: .

setup: |
  echo "Running setup."
  curl -LsSf https://astral.sh/uv/install.sh | sh
  cp pyproject.toml.sky pyproject.toml
  uv venv --clear --python=3.12
  uv pip install --upgrade pip "setuptools<81"
  uv sync
  # We have pre-built wheels stored in /data/wheels for faster installation of gpu-specific packages without wheels distributed for our target environment.
  uv pip install /data/wheels/$(uname -m)/*.whl
  mkdir -p /data/logs

run: |
  echo "Hello, SkyPilot!"
  export RUN_ID=$(date +%Y%m%d_%H%M%S)
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  source .venv/bin/activate
  ./scripts/prep-configs-for-sky.sh
  python train.py --config config/diffusion/hourglass-db-polar.toml --output_dir /data/runs/hourglass/db-polar-$RUN_ID
  echo "Run completed."
